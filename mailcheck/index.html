<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mailcheck — Outlook</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #18181b;
      background: #f4f4f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header { margin-bottom: 28px; }

    .eyebrow {
      margin: 0 0 8px;
      color: #71717a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); }
    header p:last-child { color: #71717a; line-height: 1.6; }

    .panel, .result-card {
      border: 1px solid #e4e4e7;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 26px rgb(24 24 27 / 4%);
    }

    .panel { padding: 24px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    .hint { margin: 0 0 16px; color: #71717a; font-size: 13px; }

    .form-row { display: flex; gap: 10px; }

    input {
      min-width: 0;
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #d4d4d8;
      border-radius: 10px;
      color: #18181b;
      font: inherit;
    }

    input:focus { outline: 3px solid rgb(24 24 27 / 10%); border-color: #71717a; }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #18181b;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #3f3f46; }
    button:disabled { cursor: wait; opacity: .6; }

    #status { min-height: 20px; margin: 16px 0 0; color: #52525b; font-size: 14px; }
    #status.error { color: #27272a; }
    #result { margin-top: 20px; }
    #result[hidden] { display: none; }

    .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .result-card { padding: 18px; }
    .result-label { margin: 0 0 8px; color: #71717a; font-size: 13px; }
    .result-value { margin: 0; font-size: 24px; font-weight: 700; overflow-wrap: anywhere; }
    .latest-details { margin: 16px 0 0; line-height: 1.6; }
    .saved-file { margin-top: 16px; color: #71717a; font-size: 12px; overflow-wrap: anywhere; }

    @media (max-width: 560px) {
      body { padding: 30px 16px; }
      .form-row { flex-direction: column; }
      button { width: 100%; }
      .result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Collecte locale Outlook</p>
      <h1>Mailcheck</h1>
      <p>Indiquez un dossier de la Boîte de réception pour compter les e-mails et repérer le plus récent.</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Dossier à analyser</h2>
      <form id="checkForm">
        <label for="folder">Nom ou chemin du dossier Outlook</label>
        <p class="hint">Exemple : <code>PICO</code> ou <code>Supervision/PICO</code> (sous-dossier de la Boîte de réception).</p>
        <div class="form-row">
          <input id="folder" name="folder" type="text" placeholder="PICO" autocomplete="off" required>
          <button id="submitButton" type="submit">Analyser le dossier</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" aria-live="polite" hidden>
      <div class="result-grid">
        <article class="result-card">
          <p class="result-label">Nombre d’e-mails</p>
          <p id="emailCount" class="result-value">0</p>
        </article>
        <article class="result-card">
          <p class="result-label">Dernier reçu</p>
          <p id="latestDate" class="result-value">—</p>
        </article>
      </div>
      <p id="latestDetails" class="latest-details"></p>
      <p id="savedFile" class="saved-file"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('checkForm');
    const button = document.getElementById('submitButton');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.classList.remove('error');
      status.textContent = 'Connexion à Outlook et lecture du dossier…';
      result.hidden = true;
      button.disabled = true;

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folder: document.getElementById('folder').value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'La collecte a échoué.');

        document.getElementById('emailCount').textContent = data.count;
        if (data.latest_email) {
          document.getElementById('latestDate').textContent = data.latest_email.received_at;
          document.getElementById('latestDetails').textContent =
            `Sujet : ${data.latest_email.subject || '(sans sujet)'} · Expéditeur : ${data.latest_email.sender || '(inconnu)'}`;
        } else {
          document.getElementById('latestDate').textContent = 'Aucun e-mail';
          document.getElementById('latestDetails').textContent = 'Ce dossier ne contient aucun e-mail.';
        }
        document.getElementById('savedFile').textContent = `Collecte enregistrée localement : ${data.file}`;
        status.textContent = `Dossier analysé : ${data.folder}`;
        result.hidden = false;
      } catch (error) {
        status.classList.add('error');
        status.textContent = error.message || 'Impossible de contacter le serveur local.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
